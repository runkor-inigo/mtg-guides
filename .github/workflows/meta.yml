# Nightly refresh: 7/14/30-day MTGGoldfish shares, the most common MTGO sideboard cards for the
# tracked archetypes, and the archive of published Speaker Elves results. Writes js/meta-live.js and
# js/results-archive.js and pushes them, which redeploys the site.
name: Nightly metagame refresh

on:
  schedule:
    # Meant for just after midnight in Madrid; GitHub usually starts scheduled runs hours late, and
    # update_meta.py refreshes on the first run of each Madrid day whenever it arrives.
    - cron: '5 22 * * *'
    - cron: '5 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: meta-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read MTGGoldfish
        run: python scripts/update_meta.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: Refresh the published results archive
        # Every night, even when the metagame did not change: MTGO trophies, challenges and other MTGO events,
        # plus paper events, all from MTGGoldfish. The script itself runs once per Madrid day.
        run: python scripts/update_results.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- js/meta-live.js js/results-archive.js; then echo "No change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/meta-live.js js/results-archive.js
          git commit -m "Nightly metagame refresh"
          git push
